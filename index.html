<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DeliveryMate</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:#fafafa; color:#111; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 24px; }
    .card { background:#fff; border:1px solid #e6e6e6; border-radius:12px; padding:16px; margin:16px 0; }
    label { display:block; font-size:14px; margin:10px 0 6px; }
    input, textarea, select { width:100%; padding:10px; border:1px solid #d6d6d6; border-radius:10px; font-size:14px; box-sizing:border-box; }
    textarea { min-height:88px; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .btn { padding:10px 14px; border-radius:10px; border:1px solid #111; background:#111; color:#fff; cursor:pointer; font-weight:600; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .muted { color:#666; font-size:13px; }
    pre { background:#0b0b0b; color:#eaeaea; padding:12px; border-radius:10px; overflow:auto; }
    .pill { display:inline-block; padding:2px 8px; border:1px solid #ddd; border-radius:999px; font-size:12px; background:#f7f7f7; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>DeliveryMate</h1>
  <p class="muted">Peer-to-peer delivery marketplace (NZ).</p>

  <!-- Role switch -->
  <div class="card">
    <strong>I am a:</strong>
    <label style="display:inline-block;margin-left:10px;">
      <input type="radio" name="roleSwitch" value="sender" checked /> Sender
    </label>
    <label style="display:inline-block;margin-left:10px;">
      <input type="radio" name="roleSwitch" value="driver" /> Driver
    </label>
  </div>

  <!-- API + ack info -->
  <div class="card">
    <div class="muted">Backend API: <span class="pill" id="apiBasePill"></span></div>
    <div class="muted" id="ackInfo"></div>
  </div>

  <!-- ================= SENDER ================= -->
  <div id="senderSection">

    <!-- Create -->
    <div class="card">
      <h2>Create delivery</h2>
      <form id="createForm">
        <div class="row">
          <div><label>Pickup suburb *</label><input name="pickup_suburb" required /></div>
          <div><label>Drop-off suburb *</label><input name="dropoff_suburb" required /></div>
        </div>
        <label>Item description</label><textarea name="item_description"></textarea>
        <div class="row">
          <div><label>Weight (kg)</label><input name="weight_kg" type="number" step="0.1" /></div>
          <div><label>Suggested price (NZD)</label><input name="suggested_price_nzd" type="number" step="0.01" /></div>
        </div>
        <div class="row">
          <div><label>Your name</label><input name="sender_name" /></div>
          <div><label>Your phone</label><input name="sender_phone" /></div>
        </div>
        <div class="card">
          <strong class="muted">Sender acknowledgement</strong>
          <div id="senderAckText" class="muted" style="white-space:pre-wrap;"></div>
          <label><input type="checkbox" id="ackBox" /> I agree</label>
        </div>
        <button class="btn" id="createBtn" disabled>Create request</button>
        <div class="muted" id="status"></div>
      </form>
    </div>

    <div class="card">
      <h2>Result</h2>
      <pre id="out">{}</pre>
    </div>

    <!-- View -->
    <div class="card">
      <h2>View my request</h2>
      <form id="viewForm">
        <div class="row">
          <div><label>Request ID *</label><input id="view_request_id" required /></div>
          <div><label>Sender token *</label><input id="view_sender_token" required /></div>
        </div>
        <button class="btn" id="viewBtn">Load</button>
        <div class="muted" id="viewStatus"></div>
      </form>

      <h3>Request</h3><pre id="viewRequest">{}</pre>
      <h3>Offers</h3><pre id="viewOffers">[]</pre>

      <!-- Accept offer -->
      <div class="card">
        <h3>Accept offer</h3>
        <form id="acceptOfferForm">
          <div class="row">
            <div><label>Offer ID *</label><input id="accept_offer_id" required /></div>
            <div><label>&nbsp;</label><button class="btn">Accept</button></div>
          </div>
          <div class="muted" id="acceptStatus"></div>
        </form>
        <pre id="acceptOut">{}</pre>
        <div class="row">
          <input id="driverTokenBox" readonly placeholder="driver_token appears here" />
          <button class="btn" id="copyDriverTokenBtn" type="button">Copy</button>
        </div>
        <div class="muted" id="copyStatus"></div>
      </div>

      <h3>History</h3><pre id="viewHistory">[]</pre>
    </div>
  </div>

  <!-- ================= DRIVER ================= -->
  <div id="driverSection" style="display:none;">

    <div class="card">
      <h2>Make offer</h2>
      <form id="driverOfferForm">
        <div class="row">
          <div><label>Request ID *</label><input id="offer_request_id" required /></div>
          <div><label>Price (NZD)</label><input id="offer_price_nzd" type="number" step="0.01" /></div>
        </div>
        <div class="row">
          <div><label>Driver name *</label><input id="offer_driver_name" required /></div>
          <div><label>Phone</label><input id="offer_driver_phone" /></div>
        </div>
        <label>Note</label><textarea id="offer_note"></textarea>
        <div class="card">
          <strong class="muted">Driver acknowledgement</strong>
          <div id="driverAckText" class="muted" style="white-space:pre-wrap;"></div>
          <label><input type="checkbox" id="driverAckBox" /> I agree</label>
        </div>
        <button class="btn" id="offerBtn" disabled>Submit offer</button>
        <div class="muted" id="offerStatus"></div>
      </form>
      <pre id="offerOut">{}</pre>
    </div>

    <div class="card">
      <h2>Update status</h2>
      <form id="driverStatusForm">
        <div class="row">
          <div><label>Request ID *</label><input id="ds_request_id" required /></div>
          <div><label>Status *</label>
            <select id="ds_status">
              <option value="picked_up">picked_up</option>
              <option value="delivered">delivered</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div><label>Driver name *</label><input id="ds_driver_name" required /></div>
          <div><label>Driver token *</label><input id="ds_driver_token" required /></div>
        </div>
        <button class="btn">Update</button>
        <div class="muted" id="dsStatus"></div>
      </form>
      <pre id="dsOut">{}</pre>
    </div>

  </div>
</div>

<script>
const API_BASE = "https://deliverymate.onrender.com";
document.getElementById('apiBasePill').textContent = API_BASE;

function uuid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();}
async function safeJson(r){try{return await r.json()}catch{return{ok:false,error:"non-json"}}}

let SENDER_ACK_VERSION=null, DRIVER_ACK_VERSION=null;

// Load acknowledgements
(async()=>{
  const v=await fetch(API_BASE+"/ack/versions").then(r=>r.json());
  SENDER_ACK_VERSION=v.sender_ack_version;
  DRIVER_ACK_VERSION=v.driver_ack_version;
  document.getElementById('ackInfo').textContent=`Sender ack: ${v.sender_ack_version} · Driver ack: ${v.driver_ack_version}`;
  document.getElementById('senderAckText').textContent=(await fetch(API_BASE+"/ack/sender").then(r=>r.json())).text;
  document.getElementById('driverAckText').textContent=(await fetch(API_BASE+"/ack/driver").then(r=>r.json())).text;
})();

// Role switch
document.querySelectorAll('input[name="roleSwitch"]').forEach(r=>{
  r.addEventListener('change',()=>{
    senderSection.style.display=r.value==="sender"?"":"none";
    driverSection.style.display=r.value==="driver"?"":"none";
  });
});

// Sender create
ackBox.onchange=()=>createBtn.disabled=!ackBox.checked;
createForm.onsubmit=async e=>{
  e.preventDefault();
  const data=Object.fromEntries(new FormData(createForm));
  data.sender_ack_version=SENDER_ACK_VERSION;
  const r=await fetch(API_BASE+"/requests",{method:"POST",headers:{"Content-Type":"application/json","Idempotency-Key":uuid()},body:JSON.stringify(data)});
  out.textContent=JSON.stringify(await r.json(),null,2);
};

// View
viewForm.onsubmit=async e=>{
  e.preventDefault();
  const id=view_request_id.value, tok=view_sender_token.value;
  viewRequest.textContent=JSON.stringify(await fetch(API_BASE+"/requests/"+id,{headers:{"X-Role":"sender","X-Sender-Token":tok}}).then(r=>r.json()),null,2);
  viewOffers.textContent=JSON.stringify(await fetch(API_BASE+"/requests/"+id+"/offers",{headers:{"X-Role":"sender","X-Sender-Token":tok}}).then(r=>r.json()),null,2);
  viewHistory.textContent=JSON.stringify(await fetch(API_BASE+"/requests/"+id+"/history",{headers:{"X-Role":"sender","X-Sender-Token":tok}}).then(r=>r.json()),null,2);
};

// Accept offer
acceptOfferForm.onsubmit=async e=>{
  e.preventDefault();
  const r=await fetch(`${API_BASE}/requests/${view_request_id.value}/offers/${accept_offer_id.value}/accept`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Idempotency-Key":uuid(),
      "X-Role":"sender",
      "X-Sender-Token":view_sender_token.value
    }
  });
  const j=await r.json();
  acceptOut.textContent=JSON.stringify(j,null,2);
  if(j.driver_token) driverTokenBox.value=j.driver_token;
};

// Copy token
copyDriverTokenBtn.onclick=async()=>{
  await navigator.clipboard.writeText(driverTokenBox.value);
  copyStatus.textContent="Copied ✅";
};

// Driver offer
driverAckBox.onchange=()=>offerBtn.disabled=!driverAckBox.checked;
driverOfferForm.onsubmit=async e=>{
  e.preventDefault();
  const body={
    driver_name:offer_driver_name.value,
    driver_ack_version:DRIVER_ACK_VERSION,
    price_nzd:offer_price_nzd.value||undefined,
    driver_phone:offer_driver_phone.value||undefined,
    note:offer_note.value||undefined
  };
  const r=await fetch(`${API_BASE}/requests/${offer_request_id.value}/offers`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Idempotency-Key":uuid(),
      "X-Role":"driver"
    },
    body:JSON.stringify(body)
  });
  offerOut.textContent=JSON.stringify(await r.json(),null,2);
};

// Driver status
driverStatusForm.onsubmit=async e=>{
  e.preventDefault();
  const r=await fetch(`${API_BASE}/requests/${ds_request_id.value}/status`,{
    method:"PATCH",
    headers:{
      "Content-Type":"application/json",
      "Idempotency-Key":uuid(),
      "X-Role":"driver",
      "X-Driver-Token":ds_driver_token.value
    },
    body:JSON.stringify({status:ds_status.value,driver_name:ds_driver_name.value,driver_token:ds_driver_token.value})
  });
  dsOut.textContent=JSON.stringify(await r.json(),null,2);
};
</script>
</body>
</html>
