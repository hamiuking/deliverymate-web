<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DeliveryMate — Driver</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <script type="module" src="/js/app.js"></script>
</head>

<body>
  <div id="loadingBar"></div>
  <header class="topbar">
    <nav class="nav">
      <a href="/index.html">Home</a>
      <a href="/sender.html">Sender</a>
      <a href="/driver.html" class="active">Driver</a>
      <a href="/about.html">About</a>
      <a href="/admin.html" id="navAdmin">Admin</a>
    </nav>
  </header>

  <main class="container">
    <h1>Driver</h1>

    <section class="card">
      <h2>Register as Driver</h2>
      <form id="driverRegForm">
        <label>Invite code</label>
        <input name="invite_code" required />

        <label>Full name</label>
        <input name="full_name" />

        <label>Phone</label>
        <input name="phone" required />

        <label>Vehicle plate</label>
        <input name="plate" />

        <button class="btn" type="submit">Register</button>
      </form>
      <pre id="driverRegOut">{}</pre>
    </section>

    <section class="card">
      <h2>Make Offer</h2>
      <form id="driverOfferForm">
        <label>Request ID</label>
        <input name="request_id" required />

        <label>Price (NZD)</label>
        <input name="price_nzd" type="number" step="0.01" />

        <label>Note</label>
        <textarea name="note"></textarea>

        <button class="btn" type="submit">Submit Offer</button>
      </form>
      <pre id="driverOfferOut">{}</pre>
    </section>

    <section class="card">
      <h2>View My Job</h2>
      <form id="driverViewForm">
        <label>Request ID</label>
        <input name="request_id" required />

        <button class="btn" type="submit">Load Job</button>
      </form>

      <h3>Job Details</h3>
      <pre id="dvRequest">{}</pre>

      <h3>History</h3>
      <pre id="dvHistory">[]</pre>

      <div class="muted" id="dvStatus"></div>
    </section>

    <section class="card">
      <h2>Update Status</h2>
      <form id="driverStatusForm">
        <label>Request ID</label>
        <input name="request_id" required />

        <label>Status</label>
        <select name="status">
          <option value="picked_up">picked_up</option>
          <option value="delivered">delivered</option>
        </select>

        <label>Driver name</label>
        <input name="driver_name" required />

        <button class="btn" type="submit">Update</button>
      </form>
      <pre id="dsOut">{}</pre>
    </section>
  </main>
</body>

</html>
